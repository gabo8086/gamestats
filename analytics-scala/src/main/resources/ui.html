<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameStats</title>
<style>
  :root {
    --fondo: #ffffff; --texto: #1a1a1a; --suave: #5d6470;
    --linea: #e2e5ea; --tarjeta: #f7f8fa; --acento: #2b6cb0; --marca: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fondo: #16181d; --texto: #e8eaed; --suave: #9aa2ae;
      --linea: #2c3038; --tarjeta: #1e2128; --acento: #7aa7d9; --marca: #e8a33d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px; background: var(--fondo); color: var(--texto);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 32px 0 10px; }
  .sub { color: var(--suave); margin: 0 0 8px; }
  .aviso { color: var(--suave); font-size: .88rem; border-left: 3px solid var(--linea); padding-left: 10px; margin: 12px 0 0; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: .92rem; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { color: var(--suave); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
  tbody tr.sel { background: var(--tarjeta); }
  tbody tr[data-id] { cursor: pointer; }
  tbody tr[data-id]:hover { background: var(--tarjeta); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--tarjeta);
         border: 1px solid var(--linea); font-size: .78rem; margin-right: 4px; }
  .tag.regla { border-color: var(--marca); color: var(--marca); }
  .caja { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 8px; padding: 14px 16px; margin-top: 10px; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button {
    font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--linea); background: var(--fondo); color: var(--texto);
  }
  button { cursor: pointer; border-color: var(--acento); color: var(--acento); }
  button:hover { background: var(--tarjeta); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 8px 0 0; }
  dt { color: var(--suave); font-size: .85rem; }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .vacio { color: var(--suave); font-style: italic; }
  footer { margin-top: 40px; color: var(--suave); font-size: .85rem; border-top: 1px solid var(--linea); padding-top: 12px; }
  code { background: var(--tarjeta); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
</style>
</head>
<body>
<main>
  <h1>GameStats</h1>
  <p class="sub">Resultados del módulo de análisis. Solo lectura: esta página consume los mismos
     endpoints JSON que cualquier otro cliente.</p>

  <h2>Partidas analizadas</h2>
  <div id="partidas"><p class="vacio">cargando…</p></div>
  <div id="detalle"></div>

  <h2>Jugador</h2>
  <div class="caja">
    <div class="fila">
      <input id="jugador" placeholder="p1" size="10" autocomplete="off">
      <button id="verJugador">Ver perfil</button>
      <span id="sugerencias" class="sub" style="margin:0"></span>
    </div>
    <div id="perfil"></div>
  </div>

  <h2>Ranking por juego</h2>
  <div class="caja">
    <div class="fila">
      <select id="juego"></select>
      <button id="verRanking">Ver ranking</button>
    </div>
    <div id="ranking"></div>
  </div>

  <footer>
    Las métricas de la ingestión están en el otro servicio:
    <code>http://localhost:8080/metrics</code>.
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function pedir(ruta) {
  const r = await fetch(ruta);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/** Las claves del gameSpecific vienen del analizador de cada juego: la página no las conoce de
    antemano y las muestra tal como llegan. Así un juego nuevo no obliga a tocar esto. */
function definiciones(obj) {
  const filas = Object.entries(obj ?? {}).map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${v === null ? '—' : esc(Array.isArray(v) ? v.join(', ') : v)}</dd>`);
  return filas.length ? `<dl>${filas.join('')}</dl>` : '<p class="vacio">sin datos</p>';
}

let jugadoresVistos = new Set();

async function cargarPartidas() {
  try {
    const { matches } = await pedir('/results/matches');
    if (!matches.length) {
      $('partidas').innerHTML = `<p class="vacio">Todavía no hay partidas analizadas. ` +
        `Enviá alguna con <code>gamestats ejemplos</code> o <code>gamestats simulator</code>.</p>`;
      return;
    }

    $('partidas').innerHTML = `<table><thead><tr>
        <th>Juego</th><th>Partida</th><th>Gana</th><th>Eventos</th><th>Reglas</th>
      </tr></thead><tbody>${matches.map((m) => `
        <tr data-id="${esc(m.matchId)}">
          <td>${esc(m.gameId)}</td>
          <td>${esc(m.matchId)}</td>
          <td>${m.winnerId ? esc(m.winnerId) : '<span class="vacio">sin ganador</span>'}</td>
          <td>${m.eventCount}</td>
          <td>${m.patterns.map((p) => `<span class="tag regla">${esc(p)}</span>`).join('') || '—'}</td>
        </tr>`).join('')}</tbody></table>
      <p class="aviso">Hacé clic en una partida para ver el detalle.</p>`;

    document.querySelectorAll('tr[data-id]').forEach((fila) =>
      fila.addEventListener('click', () => verPartida(fila.dataset.id, fila)));

    const juegos = [...new Set(matches.map((m) => m.gameId))].sort();
    $('juego').innerHTML = juegos.map((g) => `<option>${esc(g)}</option>`).join('');

    verPartida(matches[0].matchId, document.querySelector('tr[data-id]'));
  } catch (e) {
    $('partidas').innerHTML = `<p class="vacio">No se pudo leer el listado: ${esc(e.message)}</p>`;
  }
}

async function verPartida(id, fila) {
  document.querySelectorAll('tr.sel').forEach((f) => f.classList.remove('sel'));
  if (fila) fila.classList.add('sel');

  const d = await pedir('/results/matches/' + encodeURIComponent(id));
  d.players.forEach((p) => jugadoresVistos.add(p.playerId));
  $('sugerencias').textContent = 'jugadores: ' + [...jugadoresVistos].sort().join(', ');

  const m = d.match;
  const actividad = (d.generic?.activityPerMinute ?? [])
    .map((a) => `min ${a.minute}: ${a.events}`).join(' · ');

  $('detalle').innerHTML = `<div class="caja">
    <strong>${esc(d.matchId)}</strong> <span class="tag">${esc(d.gameId)}</span>
    <dl>
      <dt>duración</dt><dd>${m.durationMs !== null ? (m.durationMs / 1000) + ' s' : '—'}</dd>
      <dt>jugadores</dt><dd>${m.playerCount}</dd>
      <dt>ganador</dt><dd>${m.winnerId ? esc(m.winnerId) : '—'}</dd>
    </dl>

    <h3 style="font-size:.95rem;margin:16px 0 4px">De la partida</h3>
    ${definiciones(m.gameSpecific)}

    <h3 style="font-size:.95rem;margin:16px 0 4px">Por jugador</h3>
    <table><thead><tr><th>Jugador</th><th>Estadísticas</th></tr></thead><tbody>
      ${d.players.map((p) => `<tr><td><strong>${esc(p.playerId)}</strong></td>
        <td>${definiciones(p.gameSpecific)}</td></tr>`).join('')}
    </tbody></table>

    <h3 style="font-size:.95rem;margin:16px 0 4px">Reglas detectadas</h3>
    ${d.patterns.length
      ? d.patterns.map((p) => `<div style="margin-bottom:6px">
          <span class="tag regla">${esc(p.rule)}</span> ${esc(p.playerId)}
          ${definiciones(p.detail)}</div>`).join('')
      : '<p class="vacio">ninguna en esta partida</p>'}

    <h3 style="font-size:.95rem;margin:16px 0 4px">Sin conocer el juego</h3>
    <p class="aviso">Lo calcula el <code>GenericAnalyzer</code> usando solo el sobre común del
       evento, igual para los cuatro juegos.</p>
    ${definiciones(d.generic?.eventsByType)}
    <p class="sub" style="margin-top:6px">actividad por minuto — ${esc(actividad) || '—'}</p>
  </div>`;
}

async function verJugador() {
  const id = $('jugador').value.trim();
  if (!id) return;
  try {
    const d = await pedir('/results/players/' + encodeURIComponent(id));
    $('perfil').innerHTML = `
      <dl>
        <dt>partidas</dt><dd>${d.matchesPlayed}</dd>
        <dt>victorias</dt><dd>${d.wins} (${d.winRate}%)</dd>
        <dt>contra bots</dt><dd>${d.vsBots.wins} de ${d.vsBots.matchesPlayed} (${d.vsBots.winRate}%)</dd>
        <dt>contra humanos</dt><dd>${d.vsHumans.wins} de ${d.vsHumans.matchesPlayed} (${d.vsHumans.winRate}%)</dd>
        <dt>desconexiones</dt><dd>${d.disconnections.reconnections} reconexiones, ${d.disconnections.abandons} abandonos</dd>
      </dl>
      <table style="margin-top:12px"><thead><tr><th>Juego</th><th>Partidas</th><th>Acumulado</th></tr></thead>
      <tbody>${d.byGame.map((g) => `<tr><td>${esc(g.gameId)}</td><td>${g.matchesPlayed}</td>
        <td>${definiciones(g.gameSpecific)}</td></tr>`).join('')}</tbody></table>`;
  } catch (e) {
    $('perfil').innerHTML = `<p class="vacio">${e.message === 'HTTP 404'
      ? 'Ese jugador no aparece en ninguna partida analizada.' : esc(e.message)}</p>`;
  }
}

async function verRanking() {
  const juego = $('juego').value;
  try {
    const d = await pedir(`/results/games/${encodeURIComponent(juego)}/ranking?top=10`);
    $('ranking').innerHTML = `<table><thead><tr>
      <th>#</th><th>Jugador</th><th>Victorias</th><th>Partidas</th><th>%</th></tr></thead>
      <tbody>${d.ranking.map((r) => `<tr><td>${r.rank}</td><td>${esc(r.playerId)}</td>
        <td>${r.wins}</td><td>${r.matchesPlayed}</td><td>${r.winRate}%</td></tr>`).join('')}
      </tbody></table>`;
  } catch (e) {
    $('ranking').innerHTML = `<p class="vacio">${e.message === 'HTTP 404'
      ? 'Ese juego no tiene partidas analizadas.' : esc(e.message)}</p>`;
  }
}

$('verJugador').addEventListener('click', verJugador);
$('jugador').addEventListener('keydown', (e) => { if (e.key === 'Enter') verJugador(); });
$('verRanking').addEventListener('click', verRanking);
cargarPartidas();
</script>
</body>
</html>
