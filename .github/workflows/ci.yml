# CI/CD de GameStats. En cada PR compila y prueba los dos modulos, valida el contrato, construye
# la imagen y hace la prueba de integracion. En push a main o en un tag v* ademas publica la
# imagen en GitHub Container Registry y prueba la imagen publicada (jobs publish y deploy).
#
# Los cuatro jobs de CI corren en paralelo porque son independientes: ninguno necesita el
# resultado del otro, y asi un error de Go no esconde un error de Scala.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # git tag v1.0 && git push origin v1.0 publica la version fija de la entrega.
    tags: ["v*"]

# Si se empuja dos veces seguidas al mismo PR, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar jsonschema
        run: pip install jsonschema

      # Comprueba que los ejemplos cumplen los esquemas y las reglas que JSON Schema no expresa
      # (eventId unico, orden por timestamp, un caso por cada razon de rechazo).
      - name: Validar ejemplos contra los esquemas
        run: python contracts/validate.py

      # El simulador es la fuente de datos del contrato: si genera algo fuera de el, que se sepa aqui.
      # Pasó de Python a Go (decision 17), asi que este job necesita las dos herramientas. Se queda
      # junto al contrato y no en el job de Go para no renombrar un check que el ruleset exige.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false

      - name: Pruebas del simulador
        working-directory: simulator
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin gofmt:"; echo "$sin_formato"; exit 1
          fi
          go vet ./...
          go test -race ./...

  go:
    name: Go (ingest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          # El modulo no tiene dependencias externas, asi que no hay go.sum ni nada que cachear.
          cache: false

      # gofmt no falla por si solo: hay que comparar su salida.
      - name: Formato
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin gofmt:"; echo "$sin_formato"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

  scala:
    name: Scala (analytics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-scala
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: sbt test
        run: sbt -batch test

      - name: sbt assembly
        run: sbt -batch assembly

  docker:
    name: Imagenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Una sola imagen (el Dockerfile de la raiz); compose la usa para todos los servicios.
      - name: Construir la imagen
        run: docker compose build

      # Prueba de humo: los dos servicios arrancan y responden /health.
      - name: Levantar y verificar /health
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8081/health

      # Integracion de punta a punta: los ejemplos del contrato entran por Go, que los manda a Scala.
      # El modo ejemplos falla si algun rechazo no es el que espera el contrato.
      - name: Ejemplos del contrato por Go
        run: docker compose run --rm ejemplos

      # Go manda el lote a Scala en segundo plano al recibir MATCH_FINISHED, de ahi el reintento.
      - name: Las cuatro reglas en los resultados
        run: |
          resultado() {
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 "http://localhost:8081/results/matches/$1"
          }
          resultado m-racing-001     | grep -q '"rule":"comeback"'
          resultado m-combat-001     | grep -q '"rule":"streak"'
          resultado m-blackjack-001  | grep -q '"rule":"tilt"'
          resultado m-battleship-001 | grep -q '"rule":"hitStreak"'

      - name: Simulador por Go
        run: |
          docker compose run --rm simulator --no-files --delay-ms 0
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 \
            http://localhost:8081/results/matches/m-sim-combat-streak | grep -q '"rule":"streak"'
          curl -fsS http://localhost:8080/metrics

      - name: Logs si algo fallo
        if: failure()
        run: docker compose logs

      - name: Bajar todo
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------- CD
  # Solo en push a main o en un tag v*, y solo si los cuatro jobs de arriba pasaron: nunca se
  # publica una imagen que no paso las pruebas. En un PR estos dos jobs no corren.

  publish:
    name: Publicar en GHCR
    if: github.event_name == 'push'
    needs: [contracts, go, scala, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # QEMU solo hace falta para la etapa final de arm64 (un apt-get); la compilacion corre nativa.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<commit> siempre; latest en main; el nombre del tag git tal cual (v1.0) cuando se
      # empuja uno. type=ref y no type=semver, que exige tres numeros y no aceptaria v1.0.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El tag inmutable de este commit, para que el deploy pruebe exactamente esta imagen.
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Prueba lo que va a bajar cualquier persona: el compose de deploy, que descarga la imagen de
  # ghcr.io en vez de compilarla, con los mismos datos y las mismas comprobaciones que arriba.
  # A proposito NO hace docker login: si el paquete de GHCR quedo privado, este job falla, que es
  # justo lo que le pasaria al profe.
  deploy:
    name: Probar la imagen publicada
    needs: publish
    runs-on: ubuntu-latest
    env:
      GAMESTATS_TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Descargar y levantar
        run: |
          docker compose -f docker-compose.deploy.yml pull
          docker compose -f docker-compose.deploy.yml up -d --wait

      - name: Ejemplos y reglas
        run: |
          docker compose -f docker-compose.deploy.yml run --rm ejemplos
          resultado() {
            curl -fsS --retry 10 --retry-all-errors --retry-delay 1 "http://localhost:8081/results/matches/$1"
          }
          resultado m-racing-001     | grep -q '"rule":"comeback"'
          resultado m-combat-001     | grep -q '"rule":"streak"'
          resultado m-blackjack-001  | grep -q '"rule":"tilt"'
          resultado m-battleship-001 | grep -q '"rule":"hitStreak"'

      - name: Logs si algo fallo
        if: failure()
        run: docker compose -f docker-compose.deploy.yml logs

      - name: Bajar todo
        if: always()
        run: docker compose -f docker-compose.deploy.yml down -v
